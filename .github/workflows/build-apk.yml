
name: Build Two Together Church APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Pastor-Admin
            source: apps/pastor
            app_id: org.togetherchurch.skyline.pastor
            app_name: Together Church Pastor

          - variant: Member
            source: apps/member
            app_id: org.togetherchurch.skyline.member
            app_name: Together Church Member

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root!"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/Together_Church_Skyline_GitHub_APK_Project"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json not found!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/${{ matrix.source }}/index.html" ]; then
            echo "ERROR: Selected HTML file not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm install @capacitor/android@6.2.1

      - name: Prepare Selected Application
        run: |
          cd "$PROJECT_DIR"

          mkdir -p www

          cp "${{ matrix.source }}/index.html" www/index.html

          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('capacitor.config.json'));
          config.appId = '${{ matrix.app_id }}';
          config.appName = '${{ matrix.app_name }}';
          config.webDir = 'www';
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          "

      - name: Add Android Platform
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sync Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Add Android Permissions
        run: |
          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
          fi

          if ! grep -q "android.permission.MODIFY_AUDIO_SETTINGS" "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
          fi

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Together-Church-${{ matrix.variant }}-APK
          path: extracted/Together_Church_Skyline_GitHub_APK_Project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

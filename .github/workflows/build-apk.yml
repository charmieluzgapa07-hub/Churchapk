
name: Build Two Together Church APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Pastor-Admin
            source: apps/pastor
            app_id: org.togetherchurch.skyline.pastor
            app_name: Together Church Pastor

          - variant: Member
            source: apps/member
            app_id: org.togetherchurch.skyline.member
            app_name: Together Church Member

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Together Church ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Upload the project ZIP to repository root."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/Together_Church_Skyline_GitHub_APK_Project"

          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/capacitor.config.json"
          test -f "$PROJECT_DIR/${{ matrix.source }}/index.html"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Capacitor
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm install @capacitor/android@6.2.1

      - name: Prepare selected application
        run: |
          cd "$PROJECT_DIR"

          mkdir -p www
          cp "${{ matrix.source }}/index.html" www/index.html

          node -e "
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('capacitor.config.json'));
          c.appId = '${{ matrix.app_id }}';
          c.appName = '${{ matrix.app_name }}';
          c.webDir = 'www';
          fs.writeFileSync('capacitor.config.json', JSON.stringify(c,null,2));
          "

      - name: Add Android platform
        run: |
          cd "$PROJECT_DIR"
          npx cap add android
          npx cap sync android

      - name: Add microphone permissions
        run: |
          cd "$PROJECT_DIR"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Together-Church-${{ matrix.variant }}-APK
          path: extracted/Together_Church_Skyline_GitHub_APK_Project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
